<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SafeWalk — Live tracking</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    body{margin:0;font-family:Arial,sans-serif;background:#f7f8f4}
    header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#fff;border-bottom:1px solid #ddd}
    header a{color:#222;text-decoration:none;font-weight:bold}
    #status{padding:12px;text-align:center;font-weight:bold;background:#2e7d32;color:#fff}
    #status.sos{background:#c62828}
    #status.wait{background:#666}
    #map{height:calc(100vh - 105px)}
  </style>
</head>
<body>
  <header><a href="index.html">← SafeWalk</a><span>Live tracking</span></header>
  <div id="status" class="wait">Waiting for location...</div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="js/firebase.js"></script>
  <script>
    const id = new URLSearchParams(location.search).get('id');
    const statusEl = document.getElementById('status');
    const map = L.map('map').setView([28.6139, 77.2090], 12);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    let marker = null, first = true, last = null;

    if (!id) {
      statusEl.textContent = 'No trip link. Ask your contact to share again.';
    } else {
      db.ref('trips/' + id).on('value', snap => {
        const d = snap.val();
        if (!d) return;
        last = d;
        const pos = [d.lat, d.lng];
        if (!marker) marker = L.marker(pos).addTo(map); else marker.setLatLng(pos);
        if (first) { map.setView(pos, 17); first = false; } else { map.panTo(pos); }
        render();
      });
      setInterval(render, 1000);
    }

    function render() {
      if (!last) return;
      const secs = Math.max(0, Math.round((Date.now() - last.time) / 1000));
      statusEl.className = last.sos ? 'sos' : '';
      statusEl.textContent = last.sos
        ? '🚨 SOS ALERT! Last update ' + secs + 's ago'
        : '✅ Live. Updated ' + secs + 's ago';
    }
  </script>
</body>
</html>
